name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  dprint:
    name: Dprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dprint/check@v2.3

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  commit-lint:
    name: Conventional commits
    # Dependabot uses the conventional `deps` scope, which is intentionally
    # outside this repository's package scopes. Other pull requests remain
    # subject to the normal strict scope validation.
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p git-std --bin git-std -- lint --range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  install-test:
    name: Install script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: bash tools/bash_unit spec/install/install_test.sh

  changes:
    name: Detect install/release changes
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.filter.outputs.install }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            install:
              - 'install.sh'
              - 'bootstrap'
              - 'crates/git-std/src/cli/init/**'
              - 'spec/install/**'
              - 'scripts/release/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'

  install-smoke:
    name: Install smoke (${{ matrix.os }})
    if: needs.changes.outputs.install == 'true'
    needs: changes
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install and execute Unix release
        if: runner.os != 'Windows'
        shell: bash
        env:
          GIT_STD_INSTALL_DIR: ${{ runner.temp }}/git-std-bin
          GIT_STD_MAN_DIR: ${{ runner.temp }}/git-std-man
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash install.sh
          export PATH="$GIT_STD_INSTALL_DIR:$PATH"
          test -x "$GIT_STD_INSTALL_DIR/git-std"
          git-std --version
          git std --version
      - name: Install and execute Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod 'https://api.github.com/repos/driftsys/git-std/releases/latest' -Headers $headers
          $archiveName = "git-std-$env:TARGET.tar.gz"
          $archiveAsset = $release.assets | Where-Object name -eq $archiveName
          $checksumAsset = $release.assets | Where-Object name -eq "$archiveName.sha256"
          if ($null -eq $archiveAsset -or $null -eq $checksumAsset) {
            throw "Release $($release.tag_name) is missing $archiveName or its checksum"
          }

          $workDir = Join-Path $env:RUNNER_TEMP 'git-std-install-smoke'
          $installDir = Join-Path $workDir 'bin'
          New-Item -ItemType Directory -Force $installDir | Out-Null
          $archivePath = Join-Path $workDir $archiveName
          $checksumPath = Join-Path $workDir "$archiveName.sha256"
          Invoke-WebRequest $archiveAsset.browser_download_url -OutFile $archivePath
          Invoke-WebRequest $checksumAsset.browser_download_url -OutFile $checksumPath

          $expected = (Get-Content $checksumPath -Raw).Trim().Split()[0].ToLowerInvariant()
          $actual = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Checksum mismatch for $archiveName"
          }

          tar.exe -xzf $archivePath -C $installDir
          $binary = Join-Path $installDir 'git-std.exe'
          if (-not (Test-Path $binary)) {
            throw "Extracted binary not found at $binary"
          }
          $env:Path = "$installDir;$env:Path"
          & $binary --version
          git std --version

  ci:
    name: CI
    if: always()
    needs: [fmt, dprint, clippy, test, commit-lint, install-test, changes, install-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              exit 1
            fi
          done

  build-release:
    name: Build (${{ matrix.target }})
    if: github.event_name == 'push'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Install cross (aarch64-musl)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5
      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }}
      - name: Build (cargo)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: git-std-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/git-std${{ contains(matrix.target, 'windows') && '.exe' || '' }}
