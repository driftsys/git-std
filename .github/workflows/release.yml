name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install cross (aarch64-musl)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5
      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} -p git-std
      - name: Build release binary (cargo)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }} -p git-std
      - name: Collect man pages
        shell: bash
        run: |
          mkdir -p man-staging release-assets
          find target/ -path '*/build/git-std-*/out/man/*.1' -exec cp {} man-staging/ \;
      - name: Package archive and checksum
        shell: bash
        run: |
          scripts/release/package.sh \
            "${{ matrix.target }}" \
            "target/${{ matrix.target }}/release/git-std${{ matrix.ext || '' }}" \
            man-staging \
            release-assets
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          file: release-assets/git-std-${{ matrix.target }}.tar.gz
          format: spdx-json
          output-file: release-assets/git-std-${{ matrix.target }}.tar.gz.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Bind SBOM to release archive
        id: release-metadata
        shell: bash
        run: |
          archive="release-assets/git-std-${{ matrix.target }}.tar.gz"
          version="v$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "git-std") | .version')"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "tag $GITHUB_REF_NAME does not match binary package $version" >&2
            exit 1
          fi
          digest="$(cut -d' ' -f1 "$archive.sha256")"
          jq \
            --arg name "$(basename "$archive")" \
            --arg version "$version" \
            --arg digest "$digest" \
            '.name = ("git-std-release-" + $version) |
             .packages += [{
               SPDXID: "SPDXRef-ReleaseArchive",
               name: $name,
               versionInfo: $version,
               downloadLocation: "NOASSERTION",
               filesAnalyzed: false,
               checksums: [{algorithm: "SHA256", checksumValue: $digest}]
             }]' \
            "$archive.spdx.json" > "$archive.spdx.tmp"
          mv "$archive.spdx.tmp" "$archive.spdx.json"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
      - name: Sign archive with Sigstore
        shell: bash
        run: |
          archive="${{ steps.release-metadata.outputs.archive }}"
          cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.release-metadata.outputs.archive }}
      - name: Save provenance bundle
        shell: bash
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" \
            "${{ steps.release-metadata.outputs.archive }}.provenance.sigstore.json"
      - name: Verify local and hosted release evidence
        shell: bash
        run: |
          scripts/release/verify.sh \
            "${{ steps.release-metadata.outputs.archive }}" \
            "${{ steps.release-metadata.outputs.version }}" \
            --hosted
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: git-std-${{ matrix.target }}
          path: |
            release-assets/git-std-${{ matrix.target }}.tar.gz
            release-assets/git-std-${{ matrix.target }}.tar.gz.sha256
            release-assets/git-std-${{ matrix.target }}.tar.gz.sigstore.json
            release-assets/git-std-${{ matrix.target }}.tar.gz.spdx.json
            release-assets/git-std-${{ matrix.target }}.tar.gz.provenance.sigstore.json

  release:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            git-std-*.tar.gz
            git-std-*.tar.gz.sha256
            git-std-*.tar.gz.sigstore.json
            git-std-*.tar.gz.spdx.json
            git-std-*.tar.gz.provenance.sigstore.json

  publish:
    name: Publish to crates.io
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish() {
            local crate="$1"
            # Skip if already published (uses crates.io API — more reliable than cargo search).
            local pkg_version
            pkg_version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            local published
            published=$(curl -sf "https://crates.io/api/v1/crates/$crate" \
              | jq -r '.crate.newest_version // ""' || true)
            if [ "$pkg_version" = "$published" ]; then
              echo "==> $crate $pkg_version already published, skipping"
              return 0
            fi
            echo "==> Publishing $crate $pkg_version"
            cargo publish -p "$crate"
            # Wait for the crate index to update before publishing dependents.
            sleep 30
          }

          publish standard-commit
          publish standard-changelog
          publish standard-version
          publish standard-githooks
          publish git-std

          echo "==> All crates published."
